name: Feature request
description: Suggest a new format, helper, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The demo you want to make and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
